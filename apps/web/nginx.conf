server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

  # Proxy hacia la API (mismo origen: evita CORS en producción-casa)
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # El service worker y el manifest no se cachean para que las actualizaciones lleguen.
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # SPA: rutas del cliente
  location / {
    try_files $uri $uri/ /index.html;
  }
}
