name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TZ: America/Guatemala
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  verificar:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # PostgreSQL real para migraciones y pruebas de integración (ADR-010).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: menu_test
          TZ: America/Guatemala
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d menu_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Las suites de integración crean una base aislada por suite en este servidor.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/menu_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/menu_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Instalar Node (versión de .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Esquema sin deriva (drizzle-kit generate no debe crear migraciones)
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain packages/db/drizzle)" ]; then
            echo "::error::El esquema Drizzle cambió sin migración. Ejecute 'pnpm db:generate' y versione packages/db/drizzle."
            git status --porcelain packages/db/drizzle
            exit 1
          fi

      - name: Migraciones y semilla contra PostgreSQL 16
        run: |
          pnpm db:migrate
          pnpm db:seed
          pnpm db:migrate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Pruebas con cobertura
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Publicar reportes de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: |
            packages/*/coverage
            apps/*/coverage
          retention-days: 14
          if-no-files-found: ignore
