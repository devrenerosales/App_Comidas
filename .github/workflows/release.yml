name: Release
# Imágenes multi-arquitectura (linux/amd64, linux/arm64) a GHCR al etiquetar v*.
# Producción: Oracle Cloud Always Free ARM (D-11, ADR-009) — deploy/deploy.sh <versión>.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/devrenerosales/app_comidas

jobs:
  imagenes:
    name: Imagen ${{ matrix.app }}
    runs-on: ubuntu-24.04
    # arm64 se construye con QEMU: más lento que amd64.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: [api, worker, web]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: QEMU (multi-arquitectura)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquetas de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Menú Familiar ${{ matrix.app }}

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          # amd64: CI y laptop de desarrollo · arm64: producción en Oracle Ampere A1 (ADR-009)
          platforms: linux/amd64,linux/arm64
          # Navegadores de Playwright en el worker: variable del repositorio INSTALL_BROWSERS=true (HU-33).
          build-args: |
            INSTALL_BROWSERS=${{ vars.INSTALL_BROWSERS || 'false' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
